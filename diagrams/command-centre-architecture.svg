<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title description">
<title id="title">Secure Azure Hub-and-Spoke Lab architecture</title><desc id="description">Authored lab, Azure deployment pending. Hub VNet peers bidirectionally with application and data spokes; there is no transitive or direct spoke-to-spoke route. The app private endpoint accesses Blob Storage with public networking disabled. Private DNS links only to hub and app. Blob logs and metrics go to Log Analytics. The optional test VM and VNet flow logs are off by default.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 H 0 V 40" fill="none" stroke="#2b3d50" stroke-width=".5" opacity=".3"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#75dbed"/></marker></defs>
<rect width="960" height="570" rx="18" fill="#09111e"/><rect width="960" height="570" rx="18" fill="url(#grid)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="42" fill="#eef3f6" font-size="27" font-weight="600" >Private network. Explicit boundaries.</text><text x="32" y="70" fill="#d7b572" font-size="13" font-weight="600" letter-spacing="1.5">AUTHORED LAB TOPOLOGY / AZURE DEPLOYMENT PENDING</text><path d="M480 202V230H172V268" fill="none" stroke="#75dbed" stroke-width="2"/><path d="M480 230H788V268" fill="none" stroke="#75dbed" stroke-width="2"/><rect x="344" y="94" width="272" height="108" rx="12" fill="#101d2d" stroke="#75dbed"/><text x="367" y="125" fill="#75dbed" font-size="14" font-weight="600" letter-spacing="1">HUB VNET</text><text x="367" y="157" fill="#eef3f6" font-size="23" font-weight="600" >10.0.0.0/16</text><text x="367" y="184" fill="#acbdca" font-size="15" font-weight="400" >Management + shared services</text><rect x="32" y="268" width="280" height="120" rx="12" fill="#101d2d" stroke="#75dbed"/><text x="54" y="298" fill="#75dbed" font-size="14" font-weight="600" letter-spacing="1">APP SPOKE</text><text x="54" y="330" fill="#eef3f6" font-size="23" font-weight="600" >10.10.0.0/16</text><text x="54" y="363" fill="#acbdca" font-size="16" font-weight="400" >Blob private endpoint subnet</text><rect x="648" y="268" width="280" height="120" rx="12" fill="#101d2d" stroke="#75dbed"/><text x="670" y="298" fill="#75dbed" font-size="14" font-weight="600" letter-spacing="1">DATA SPOKE</text><text x="670" y="330" fill="#eef3f6" font-size="23" font-weight="600" >10.20.0.0/16</text><text x="670" y="363" fill="#acbdca" font-size="16" font-weight="400" >No app-to-data peering</text><text x="42" y="220" fill="#acbdca" font-size="15" font-weight="400" >Bidirectional peerings; no hub transit</text><rect x="344" y="268" width="272" height="120" rx="12" fill="#101d2d" stroke="#d7b572"/><text x="366" y="298" fill="#d7b572" font-size="14" font-weight="600" letter-spacing="1">PRIVATE DNS</text><text x="366" y="331" fill="#eef3f6" font-size="21" font-weight="600" >Blob private zone</text><text x="366" y="363" fill="#acbdca" font-size="16" font-weight="400" >Linked to hub + app only</text><path d="M480 202V268" fill="none" stroke="#d7b572" stroke-width="2" stroke-dasharray="5 5"/><path d="M312 349H344" fill="none" stroke="#d7b572" stroke-width="2" stroke-dasharray="5 5"/><rect x="344" y="432" width="272" height="88" rx="12" fill="#101d2d" stroke="#75dbed"/><text x="366" y="464" fill="#75dbed" font-size="14" font-weight="600" letter-spacing="1">BLOB STORAGE</text><text x="366" y="496" fill="#eef3f6" font-size="18" font-weight="600" >Public network disabled</text><path d="M172 388V476H344" fill="none" stroke="#75dbed" stroke-width="2" marker-end="url(#arrow)"/><text x="37" y="417" fill="#75dbed" font-size="15" font-weight="400" >Private Link</text><rect x="648" y="432" width="280" height="88" rx="12" fill="#101d2d" stroke="#2b3d50"/><text x="670" y="464" fill="#75dbed" font-size="14" font-weight="600" letter-spacing="1">LOG ANALYTICS</text><text x="670" y="496" fill="#eef3f6" font-size="18" font-weight="600" >Blob logs + metrics</text><path d="M616 476H648" fill="none" stroke="#75dbed" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="548" fill="#acbdca" font-size="15" font-weight="400" >Test VM and VNet flow logs are optional and off by default.</text></g></svg>