<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Secure Azure hub-and-spoke lab architecture</title>
  <desc id="desc">Three resource groups contain a hub network, two spoke networks, private storage, and monitoring. The hub peers with both spokes. Private DNS supports a Blob private endpoint. Diagnostics flow to Log Analytics.</desc>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #172033; }
    .boundary { fill: #f7f9fc; stroke: #7b8ba7; stroke-width: 2; rx: 18; }
    .group { fill: #fff; stroke: #b5c1d4; stroke-width: 2; rx: 14; }
    .network { fill: #e8f3ff; stroke: #0078d4; stroke-width: 2; rx: 12; }
    .service { fill: #eefaf4; stroke: #16825d; stroke-width: 2; rx: 12; }
    .monitor { fill: #fff4e5; stroke: #b65d00; stroke-width: 2; rx: 12; }
    .label { font-size: 18px; font-weight: 700; }
    .small { font-size: 14px; }
    .line { stroke: #0078d4; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .dash { stroke: #16825d; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow-green); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0078d4"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16825d"/></marker>
  </defs>
  <rect class="boundary" x="20" y="20" width="1160" height="680"/>
  <text class="label" x="45" y="55">Azure subscription · eastus2 lab</text>
  <rect class="group" x="55" y="85" width="715" height="440"/>
  <text class="label" x="75" y="118">Network resource group</text>
  <rect class="network" x="290" y="145" width="245" height="130"/>
  <text class="label" x="315" y="178">Hub VNet · 10.0.0.0/16</text>
  <text class="small" x="315" y="208">Management · 10.0.1.0/24</text>
  <text class="small" x="315" y="232">Shared services · 10.0.2.0/24</text>
  <text class="small" x="315" y="256">NSGs · no transit appliance</text>
  <rect class="network" x="85" y="345" width="270" height="145"/>
  <text class="label" x="110" y="378">App spoke · 10.10.0.0/16</text>
  <text class="small" x="110" y="408">Workload + private endpoint subnets</text>
  <text class="small" x="110" y="432">NSGs · ASG · route table</text>
  <text class="small" x="110" y="456">Optional private validation VM</text>
  <rect class="network" x="470" y="345" width="270" height="145"/>
  <text class="label" x="495" y="378">Data spoke · 10.20.0.0/16</text>
  <text class="small" x="495" y="408">Workload + private endpoint subnets</text>
  <text class="small" x="495" y="432">NSGs · ASG · route table</text>
  <text class="small" x="495" y="456">Cross-spoke prefix blackholed</text>
  <path class="line" d="M350 275 L245 345"/><path class="line" d="M475 275 L575 345"/>
  <text class="small" x="215" y="310">bidirectional peering</text><text class="small" x="520" y="310">bidirectional peering</text>
  <rect class="service" x="800" y="85" width="345" height="205"/>
  <text class="label" x="825" y="120">Workload resource group</text>
  <text class="small" x="825" y="158">Storage Account · public network disabled</text>
  <text class="small" x="825" y="186">Blob private endpoint · app spoke</text>
  <text class="small" x="825" y="214">Private DNS zone group</text>
  <text class="small" x="825" y="242">Blob diagnostics → Log Analytics</text>
  <path class="dash" d="M355 415 L800 210"/>
  <rect class="monitor" x="800" y="330" width="345" height="195"/>
  <text class="label" x="825" y="365">Monitoring resource group</text>
  <text class="small" x="825" y="403">Log Analytics workspace</text>
  <text class="small" x="825" y="431">Diagnostic storage</text>
  <text class="small" x="825" y="459">Action group + RG deletion alert</text>
  <text class="small" x="825" y="487">Optional VNet flow logs</text>
  <path class="dash" d="M970 290 L970 330"/>
  <rect class="group" x="55" y="560" width="1090" height="105"/>
  <text class="label" x="80" y="595">Management path</text>
  <text class="small" x="80" y="625">Engineer → Azure CLI or PowerShell → lint/build → ARM validate → what-if → explicit confirmation → subscription deployment</text>
  <text class="small" x="80" y="650">No inbound management endpoint. Azure VM Run Command is used only when the temporary validation VM is enabled.</text>
</svg>
